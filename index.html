<!doctype html>
<html lang="es" data-theme="ficha" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#12161b" />
    <meta
      name="description"
      content="cajita — un editor de sitios hipermediales pequeños, hechos a mano."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>cajita</title>
    <script>
      // Apply the saved theme and language before first paint. Keep this tiny;
      // the real state lives in src/lib/state/preferences.svelte.js.
      (function () {
        try {
          var mode = localStorage.getItem('cajita.mode');
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.dataset.mode = mode;
            var themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) {
              themeColor.setAttribute('content', mode === 'dark' ? '#12161b' : '#f7f1e5');
            }
          }
          var locale = localStorage.getItem('cajita.locale');
          if (locale === 'es' || locale === 'en') {
            document.documentElement.lang = locale;
          }
          var scale = parseFloat(localStorage.getItem('cajita.uiScale'));
          if (Number.isFinite(scale) && scale >= 0.9 && scale <= 1.3) {
            document.documentElement.style.setProperty('--ui-scale', String(scale));
          }
        } catch (error) {
          // Private mode / disabled storage: defaults are fine.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p>cajita necesita JavaScript para editar. El sitio exportado no lo necesita.</p>
    </noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
